<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#08090f">
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
  <title>Gelecek Maçlar</title>
</head>
<body>
<main class="app-shell">
  <header class="topbar">
    <div class="brand"><div class="brand-mark">B</div><div class="brand-title">Basket Signal</div></div>
    <nav class="nav"><a class="nav-link" href="/">Canlı sinyaller</a><a class="nav-link active" href="/upcoming/">Gelecek maçlar</a><a class="nav-link" href="/deleted-matches">Geçmiş</a><a class="nav-link" href="/bankroll">Bankroll</a></nav>
  </header>

  <section class="hero">
    <div><h1>Gelecek maçlar</h1></div>
    <div class="actions"><button class="button primary" id="fetchBtn">AiScore'dan güncelle</button><button class="button" id="refreshBtn">Yenile</button></div>
  </section>

  <section class="stats" aria-label="Program özeti">
    <article class="stat-card"><div class="stat-label">Toplam maç <span class="stat-icon">◎</span></div><strong class="stat-value" id="statTotal">0</strong></article>
    <article class="stat-card green"><div class="stat-label">Takipte <span class="stat-icon">✓</span></div><strong class="stat-value" id="statFollowed">0</strong></article>
    <article class="stat-card red"><div class="stat-label">Yoksayılan <span class="stat-icon">×</span></div><strong class="stat-value" id="statIgnored">0</strong></article>
    <article class="stat-card yellow"><div class="stat-label">Barem bulunan <span class="stat-icon">↔</span></div><strong class="stat-value" id="statLines">0</strong></article>
  </section>

  <section class="panel">
    <div class="panel-header">
      <div><h2 class="panel-title">Maç programı</h2><div class="panel-subtitle" id="status">Yükleniyor…</div></div>
      <button class="button danger" id="clearBtn">Listeyi temizle</button>
    </div>
    <div class="toolbar"><input class="search" id="searchInput" type="search" placeholder="Maç veya lig ara…"><div class="filters"><button class="button filter-button active" data-view="all">Tümü</button><button class="button filter-button" data-view="followed">Takip</button></div></div>
    <div class="table-wrap">
      <table class="data-table upcoming-table">
        <thead><tr><th>Saat</th><th>Maç</th><th class="num">Açılış</th><th class="num">Maç önü</th><th>Durum</th><th>İşlemler</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="empty" id="empty" hidden><span class="empty-symbol">◷</span><strong>Yaklaşan maç yok</strong>Önümüzdeki 24 saat için kayıt bulunamadı.</div>
    </div>
  </section>
</main>
<script>
  const $=id=>document.getElementById(id);
  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmt=v=>Number.isFinite(Number(v))?Number(v).toFixed(1):'–';
  let matches=[];let view='all';
  function desktopMatchUrl(value){try{const url=new URL(String(value??''));if(!['http:','https:'].includes(url.protocol))return '';if(url.hostname.toLowerCase()==='m.aiscore.com')url.hostname='www.aiscore.com';return url.toString()}catch(_){return ''}}
  async function call(url,options={}){const r=await fetch(url,{headers:{'Content-Type':'application/json'},...options});const d=await r.json();if(!r.ok)throw new Error(d.error||'İşlem başarısız');return d}
  async function action(id,name){await call(`/upcoming/api/matches/${encodeURIComponent(id)}/${name}`,{method:'POST',body:'{}'});await load()}
  function filtered(){const q=$('searchInput').value.trim().toLocaleLowerCase('tr-TR');return matches.filter(m=>(view==='all'||m.followed)&&(!q||`${m.match_name||''} ${m.tournament||''}`.toLocaleLowerCase('tr-TR').includes(q)))}
  function render(){const rows=filtered();$('empty').hidden=rows.length>0;$('rows').innerHTML=rows.map(m=>{const desktopUrl=desktopMatchUrl(m.url);const name=desktopUrl?`<a class="match-link" href="${esc(desktopUrl)}" target="_blank" rel="noopener">${esc(m.match_name)}</a>`:`<span class="plain-match">${esc(m.match_name)}</span>`;const state=m.followed?'<span class="result-pill success">Takipte</span>':m.ignored?'<span class="result-pill failed">Yoksayıldı</span>':'<span class="match-meta">Normal</span>';return `<tr>
    <td><strong>${esc(m.kickoff||'–')}</strong></td>
    <td data-label="Maç" class="primary-cell"><div class="match-cell"><div class="match-info">${name}<span class="match-meta">${esc(m.tournament||'Lig bilgisi yok')}</span></div></div></td>
    <td data-label="Açılış" class="num"><strong>${fmt(m.opening_total)}</strong></td><td data-label="Maç önü" class="num"><strong>${fmt(m.prematch_total)}</strong></td>
    <td data-label="Durum">${state}</td>
    <td data-label="İşlemler"><div class="row-actions"><button class="button ${m.followed?'active':''}" onclick="action('${esc(m.match_id)}','follow')">Takip</button><button class="button ${m.ignored?'active':''}" onclick="action('${esc(m.match_id)}','ignore')">Yoksay</button><button class="button danger" onclick="action('${esc(m.match_id)}','delete')">Sil</button></div></td></tr>`}).join('');$('statTotal').textContent=matches.length;$('statFollowed').textContent=matches.filter(m=>m.followed).length;$('statIgnored').textContent=matches.filter(m=>m.ignored).length;$('statLines').textContent=matches.filter(m=>Number.isFinite(Number(m.opening_total))).length}
  async function load(){try{const d=await call('/upcoming/api/list');matches=d.matches||[];render();const state=d.running?'AiScore çekimi sürüyor':`${filtered().length} maç gösteriliyor`;$('status').textContent=`${state} · ${d.report?.status||'hazır'}`;if(d.running)setTimeout(load,3000)}catch(e){$('status').textContent=e.message;$('status').classList.add('error')}}
  $('searchInput').addEventListener('input',render);document.querySelectorAll('[data-view]').forEach(button=>button.addEventListener('click',()=>{view=button.dataset.view;document.querySelectorAll('[data-view]').forEach(item=>item.classList.toggle('active',item===button));render()}));
  $('fetchBtn').onclick=async()=>{await call('/upcoming/api/fetch',{method:'POST',body:'{}'});await load()};$('refreshBtn').onclick=load;$('clearBtn').onclick=async()=>{if(confirm('Gelecek maç listesi temizlensin mi?')){await call('/upcoming/api/clear',{method:'POST',body:'{}'});await load()}};load();
</script>
</body>
</html>
