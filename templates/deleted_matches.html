<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#08090f">
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
  <title>Sinyal Geçmişi</title>
</head>
<body>
<main class="app-shell">
  <header class="topbar">
    <div class="brand"><div class="brand-mark">B</div><div class="brand-title">Basket Signal</div></div>
    <nav class="nav"><a class="nav-link" href="/">Canlı sinyaller</a><a class="nav-link" href="/upcoming/">Gelecek maçlar</a><a class="nav-link active" href="/deleted-matches">Geçmiş</a><a class="nav-link" href="/bankroll">Bankroll</a></nav>
  </header>

  <section class="hero">
    <div><h1>Geçmiş ve sonuçlar</h1></div>
    <div class="actions"><a class="button" href="/api/deleted-matches/export.csv">CSV indir</a><button class="button primary" id="checkBtn">Sonuçları kontrol et</button></div>
  </section>

  <section class="panel">
    <div class="panel-header">
      <div><h2 class="panel-title">Arşiv özeti</h2><div class="panel-subtitle" id="summary">Yükleniyor…</div></div>
      <button class="button icon-action danger archive-delete-button" id="clearBtn" title="Tüm geçmişi sil" aria-label="Tüm geçmişi sil"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v5M14 11v5"></path></svg></button>
    </div>
    <div class="report-grid">
      <button type="button" class="report-item report-filter active" data-result="all"><span>Toplam</span><strong><b id="reportTotal">0</b><small id="reportTotalUnique">(0 benzersiz)</small></strong></button>
      <button type="button" class="report-item report-filter" data-result="resolved"><span>Sonuçlanan</span><strong><b id="reportResolved">0</b><small id="reportResolvedUnique">(0 benzersiz)</small></strong></button>
      <button type="button" class="report-item report-filter" data-result="Başarılı"><span>Başarılı</span><strong style="color:var(--green)"><b id="reportSuccess">0</b><small id="reportSuccessUnique">(0 benzersiz)</small></strong></button>
      <button type="button" class="report-item report-filter" data-result="Başarısız"><span>Başarısız</span><strong style="color:var(--red)"><b id="reportFailed">0</b><small id="reportFailedUnique">(0 benzersiz)</small></strong></button>
      <button type="button" class="report-item report-filter" data-result="İade"><span>İade</span><strong style="color:var(--yellow)"><b id="reportPush">0</b><small id="reportPushUnique">(0 benzersiz)</small></strong></button>
    </div>
    <div class="toolbar">
      <input class="search" id="searchInput" type="search" placeholder="Arşivde maç veya lig ara…">
      <div class="filters archive-filters" aria-label="Geçmiş sinyal filtreleri">
        <button class="button filter-button active" data-result="all">Tümü</button>
        <button class="button filter-button" data-result="Başarılı">Başarılı</button>
        <button class="button filter-button" data-result="Başarısız">Başarısız</button>
        <button class="button filter-button unique-toggle" id="uniqueBtn">Tekrarları gizle</button>
      </div>
    </div>
    <div class="panel-header archive-status-row"><div class="status-line" id="status"></div></div>
    <div class="table-wrap">
      <table class="data-table archive-table">
        <thead><tr><th>Maç</th><th>Sinyal anı</th><th class="num">Barem hareketi</th><th class="num">Fark</th><th>Yön</th><th class="num">Projeksiyon</th><th class="sortable-column" aria-sort="none"><button type="button" class="table-sort-button" id="qualitySortBtn">SKS <span id="qualitySortIndicator">↕</span></button></th><th>Final</th><th>Sonuç</th><th>Arşiv</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="empty" id="empty" hidden><span class="empty-symbol">⌁</span><strong id="emptyTitle">Arşiv boş</strong><span id="emptyText">Arşivlenen sinyaller burada gösterilecek.</span></div>
    </div>
    <nav class="pagination" id="pagination" aria-label="Geçmiş sinyal sayfaları" hidden>
      <button type="button" class="button" id="previousPage">Önceki</button>
      <span class="pagination-info" id="pageInfo">Sayfa 1 / 1</span>
      <button type="button" class="button" id="nextPage">Sonraki</button>
    </nav>
  </section>
</main>

<div class="signal-modal-backdrop" id="qualityModal" hidden role="dialog" aria-modal="true" aria-labelledby="qualityModalTitle" onclick="if(event.target === this) closeQualityModal()">
  <section class="signal-modal-card quality-modal-card">
    <header class="signal-modal-header">
      <div><h2 id="qualityModalTitle">Sinyal Kalite Skoru</h2></div>
      <button class="signal-modal-close" type="button" onclick="closeQualityModal()" aria-label="Kapat">×</button>
    </header>
    <div class="signal-modal-body quality-modal-body" id="qualityModalBody"></div>
  </section>
</div>
<script>
  const $=id=>document.getElementById(id);
  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmt=v=>Number.isFinite(Number(v))?Number(v).toFixed(1):'–';
  let archiveRows=[];
  let resultFilter='all';
  let uniqueOnly=false;
  let qualitySortDirection='';
  const pageSize=25;
  let currentPage=1;
  function desktopMatchUrl(value){try{const url=new URL(String(value??''));if(!['http:','https:'].includes(url.protocol))return '';if(url.hostname.toLowerCase()==='m.aiscore.com')url.hostname='www.aiscore.com';return url.toString()}catch(_){return ''}}
  async function call(url,options={}){const r=await fetch(url,{headers:{'Content-Type':'application/json'},...options});const d=await r.json();if(!r.ok)throw new Error(d.error||'İşlem başarısız');return d}
  async function purge(id){if(confirm('Bu kayıt silinsin mi?')){await call(`/api/deleted-matches/${id}`,{method:'DELETE'});await load()}}
  function uniqueSignalKey(row){return `${String(row.match_id||`alert:${row.id||''}`)}\u0000${String(row.direction||'').toLocaleUpperCase('tr-TR')}`}
  function uniqueSignals(rows){const chosen=new Map();rows.forEach((row,index)=>{const key=uniqueSignalKey(row);const number=Number(row.signal_count||1);const current=chosen.get(key);if(!current||number<current.number)chosen.set(key,{row,number,index})});return rows.filter(row=>chosen.get(uniqueSignalKey(row))?.row===row)}
  function matchesResult(row){if(resultFilter==='all')return true;if(resultFilter==='resolved')return ['Başarılı','Başarısız','İade'].includes(row.result);return row.result===resultFilter}
  function filtered(){const q=$('searchInput').value.trim().toLocaleLowerCase('tr-TR');const matches=archiveRows.filter(a=>matchesResult(a)&&(!q||`${a.match_name||''} ${a.tournament||''}`.toLocaleLowerCase('tr-TR').includes(q)));return uniqueOnly?uniqueSignals(matches):matches}
  function sortedByQuality(rows){if(!qualitySortDirection)return rows;const direction=qualitySortDirection==='desc'?-1:1;return [...rows].sort((left,right)=>{const leftScore=Number(left.signal_quality?.score);const rightScore=Number(right.signal_quality?.score);const leftAvailable=left.signal_quality?.score!==null&&left.signal_quality?.score!==''&&Number.isFinite(leftScore);const rightAvailable=right.signal_quality?.score!==null&&right.signal_quality?.score!==''&&Number.isFinite(rightScore);if(leftAvailable!==rightAvailable)return leftAvailable?-1:1;if(!leftAvailable)return 0;return(leftScore-rightScore)*direction})}
  function toggleQualitySort(){qualitySortDirection=qualitySortDirection==='desc'?'asc':'desc';currentPage=1;$('qualitySortIndicator').textContent=qualitySortDirection==='desc'?'↓':'↑';$('qualitySortBtn').closest('th').setAttribute('aria-sort',qualitySortDirection==='desc'?'descending':'ascending');render()}
  function qualityButton(alert){const quality=alert.signal_quality||{};const score=Number(quality.score);const available=quality.score!==null&&quality.score!==''&&Number.isFinite(score);const tones=['strong','good','uncertain','weak'];const tone=available&&tones.includes(quality.tone)?quality.tone:'unavailable';const label=available?String(quality.label||'SKS'):'Veri yok';return `<button type="button" class="quality-score-trigger ${tone}" onclick="openQualityModal(event,${Number(alert.id)})" title="Arşivlenen kalite açıklamasını aç" aria-label="Arşivlenen sinyal kalite skoru: ${available?Math.round(score):'hesaplanamadı'}"><strong>${available?Math.round(score):'–'}</strong><span>${esc(label)}</span></button>`}
  function openQualityModal(event,alertId){event?.stopPropagation();const alert=archiveRows.find(item=>Number(item.id)===Number(alertId));if(!alert)return;const quality=alert.signal_quality||{};const score=Number(quality.score);const available=quality.score!==null&&quality.score!==''&&Number.isFinite(score);const tones=['strong','good','uncertain','weak'];const tone=available&&tones.includes(quality.tone)?quality.tone:'unavailable';const factors=Array.isArray(quality.factors)?quality.factors:[];const factorRows=factors.map(factor=>{const states=['support','against','neutral'];const state=states.includes(factor.state)?factor.state:'neutral';const symbol=state==='support'?'✓':state==='against'?'!':'–';return `<div class="quality-factor ${state}"><span class="quality-factor-symbol">${symbol}</span><div><strong>${esc(factor.label||'')}</strong><p>${esc(factor.text||'')}</p></div></div>`}).join('');$('qualityModalTitle').textContent=`SKS · ${alert.match_name||'Sinyal'}`;$('qualityModalBody').innerHTML=`<div class="quality-summary ${tone}"><strong>${available?Math.round(score):'–'}</strong><div><span>Sinyal Kalite Skoru</span><b>${esc(quality.label||'Hesaplanamadı')}</b></div></div><p class="quality-verdict">${esc(quality.verdict||'Bu arşiv kaydında SKS bulunmuyor.')}</p>${factorRows?`<div class="quality-factor-list">${factorRows}</div>`:''}<p class="quality-note">${esc(quality.note||'Eski arşiv kayıtları için yeniden hesaplama yapılmaz.')}</p>`;$('qualityModal').hidden=false;document.body.classList.add('modal-open')}
  function closeQualityModal(){$('qualityModal').hidden=true;document.body.classList.remove('modal-open')}
  function statusText(total,start,end,totalPages){const parts=[total?`${total} kayıttan ${start+1}–${end} gösteriliyor`:'0 kayıt',`Sayfa ${currentPage} / ${totalPages}`];if(resultFilter!=='all')parts.push(resultFilter==='resolved'?'Sonuçlanan':resultFilter);if(uniqueOnly)parts.push('tekrarlar gizli');return parts.join(' · ')}
  function syncResultFilters(){document.querySelectorAll('[data-result]').forEach(item=>{const active=item.dataset.result===resultFilter;item.classList.toggle('active',active);item.setAttribute('aria-pressed',String(active))})}
  function chooseResultFilter(value){resultFilter=value;currentPage=1;syncResultFilters();render()}
  function render(){const filteredRows=sortedByQuality(filtered());const totalPages=Math.max(1,Math.ceil(filteredRows.length/pageSize));currentPage=Math.min(Math.max(1,currentPage),totalPages);const start=(currentPage-1)*pageSize;const rows=filteredRows.slice(start,start+pageSize);const end=start+rows.length;$('empty').hidden=filteredRows.length>0;$('emptyTitle').textContent=archiveRows.length?'Filtreye uygun kayıt yok':'Arşiv boş';$('emptyText').textContent=archiveRows.length?'Seçili filtreleri değiştirerek diğer sinyalleri görebilirsiniz.':'Arşivlenen sinyaller burada gösterilecek.';$('rows').innerHTML=rows.map(a=>{const change=Number(a.barem_change);const changeAvailable=a.barem_change!==null&&a.barem_change!==''&&Number.isFinite(change);const signed=changeAvailable?`${change>0?'+':''}${change.toFixed(1)}`:'–';const projection=Number(a.pace_projection);const projectionAvailable=a.pace_projection!==null&&a.pace_projection!==''&&Number.isFinite(projection);const resultClass=a.result==='Başarılı'?'success':a.result==='Başarısız'?'failed':a.result==='İade'?'push':a.result==='Devam Ediyor'?'in-progress':'unresolved';const desktopUrl=desktopMatchUrl(a.url);const link=desktopUrl?`<a class="match-link" href="${esc(desktopUrl)}" target="_blank" rel="noopener">${esc(a.match_name)}</a>`:`<span class="plain-match">${esc(a.match_name)}</span>`;return `<tr>
    <td class="primary-cell"><div class="match-cell"><div class="match-info">${link}<span class="match-meta">${esc(a.tournament||'Lig bilgisi yok')}</span></div></div></td>
    <td data-label="Sinyal anı"><strong>${esc(a.score||'–')}</strong><span class="match-meta">${esc(a.status||'–')}</span></td>
    <td data-label="Barem" class="num"><span class="line-stack">${fmt(a.opening)} <span class="line-arrow">→</span> ${fmt(a.live)}</span></td>
    <td data-label="Fark" class="num"><span class="change-pill ${changeAvailable?(change>0?'positive':'negative'):''}">${signed}</span></td>
    <td data-label="Yön"><span class="direction-pill ${a.direction==='ALT'?'alt':'ust'}">${esc(a.direction||'–')}</span></td>
    <td data-label="Projeksiyon" class="num projection-cell"><span class="projection-pill ${projectionAvailable?'':'unavailable'}">${projectionAvailable?fmt(projection):'–'}</span></td>
    <td data-label="SKS">${qualityButton(a)}</td>
    <td data-label="Final"><strong>${esc(a.final_score||'–')}</strong><span class="match-meta">${esc(a.final_status||'')}</span></td>
    <td data-label="Sonuç"><span class="result-pill result-readonly ${resultClass}">${esc(a.result||'Sonuç bekliyor')}</span></td>
    <td data-label="Arşiv"><span class="match-meta">${esc(a.deleted_at||'–')}</span></td>
    <td data-label="İşlem"><button class="button icon-action danger archive-delete-button" onclick="purge(${a.id})" title="Kaydı sil" aria-label="Kaydı sil"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v5M14 11v5"></path></svg></button></td></tr>`}).join('');$('pagination').hidden=filteredRows.length<=pageSize;$('previousPage').disabled=currentPage===1;$('nextPage').disabled=currentPage===totalPages;$('pageInfo').textContent=`Sayfa ${currentPage} / ${totalPages}`;$('status').textContent=statusText(filteredRows.length,start,end,totalPages)}
  function setReportValue(id,value,unique){$(id).textContent=value||0;$(`${id}Unique`).textContent=`(${unique||0} benzersiz)`}
  async function load(){try{archiveRows=await call('/api/deleted-matches');const report=await call('/api/deleted-matches/report');setReportValue('reportTotal',report.total,report.unique_total);setReportValue('reportResolved',report.resolved,report.unique_resolved);setReportValue('reportSuccess',report.successful,report.unique_successful);setReportValue('reportFailed',report.failed,report.unique_failed);setReportValue('reportPush',report.push,report.unique_push);$('summary').textContent='Güncel sonuç dağılımı';render()}catch(e){$('status').textContent=e.message;$('status').classList.add('error')}}
  $('searchInput').addEventListener('input',()=>{currentPage=1;render()});
  document.querySelectorAll('[data-result]').forEach(button=>button.addEventListener('click',()=>chooseResultFilter(button.dataset.result)));
  $('uniqueBtn').onclick=()=>{uniqueOnly=!uniqueOnly;currentPage=1;$('uniqueBtn').classList.toggle('active',uniqueOnly);$('uniqueBtn').textContent=uniqueOnly?'Tekrarları göster':'Tekrarları gizle';render()};
  $('qualitySortBtn').onclick=toggleQualitySort;
  $('previousPage').onclick=()=>{if(currentPage>1){currentPage-=1;render()}};
  $('nextPage').onclick=()=>{const totalPages=Math.max(1,Math.ceil(filtered().length/pageSize));if(currentPage<totalPages){currentPage+=1;render()}};
  $('checkBtn').onclick=async()=>{$('status').textContent='Sonuçlar kontrol ediliyor…';await call('/api/deleted-matches/check-results',{method:'POST',body:'{}'});await load()};
  $('clearBtn').onclick=async()=>{if(confirm('Tüm arşiv silinsin mi?')){await call('/api/deleted-matches/clear',{method:'POST',body:'{}'});await load()}};
  document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!$('qualityModal').hidden)closeQualityModal()});
  load();
</script>
</body>
</html>
